<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE TERMINAL CHAT v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --matrix-green: #00ff41;
            --matrix-dark: #00751a;
            --border-glow: 0 0 12px rgba(0, 255, 65, 0.3);
            --danger: #ff003c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--matrix-green);
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed; /* منع الـ Bounce المزعج بالموبايل */
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* تيرمنال سبيس علوي */
        .system-log {
            position: absolute;
            top: 2px;
            left: 10px;
            font-size: 10px;
            color: var(--matrix-dark);
            z-index: 100;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }

        .screen.hidden {
            display: none !important;
        }

        .card-box {
            background: rgba(0, 10, 0, 0.9);
            padding: 25px 20px;
            border: 1px solid var(--matrix-green);
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .btn {
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 12px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:active {
            background: var(--matrix-green);
            color: #000;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #000;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 14px;
            border-radius: 0;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-green);
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
        }

        /* نظام التخطيط المرن للجوال والكمبيوتر */
        .chat-layout {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #020802;
            border-left: 1px solid var(--matrix-dark);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 5;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--matrix-dark);
            background: #000;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .section-title {
            padding: 8px 12px;
            font-size: 11px;
            color: var(--matrix-dark);
            border-bottom: 1px dashed var(--matrix-dark);
            background: #010c01;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .user-item {
            padding: 12px;
            border-bottom: 1px solid #001a00;
            cursor: pointer;
        }

        .user-item:active {
            background: #002200;
        }

        .user-item h4 { font-size: 14px; margin-bottom: 3px; }
        .user-item span { font-size: 11px; color: var(--matrix-dark); }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--matrix-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020502;
            min-height: 50px;
        }

        .back-btn {
            display: none;
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .msg-time {
            font-size: 9px;
            display: block;
            margin-top: 4px;
            opacity: 0.6;
            text-align: left;
        }

        .message.sent {
            align-self: flex-start;
            border-right: 2px solid var(--matrix-green);
            background: #001100;
        }

        .message.received {
            align-self: flex-end;
            border-left: 2px solid var(--matrix-dark);
            background: #050505;
            color: #bbb;
        }

        .chat-input-box {
            padding: 10px;
            border-top: 1px solid var(--matrix-dark);
            display: flex;
            gap: 8px;
            background: #000;
            align-items: center;
        }

        .chat-input-box input {
            margin-bottom: 0;
            flex: 1;
        }

        .chat-input-box .btn {
            width: 85px;
            padding: 10px;
        }

        .small-btn {
            padding: 3px 6px;
            font-size: 11px;
            border: 1px solid var(--matrix-dark);
            background: transparent;
            color: var(--matrix-dark);
            cursor: pointer;
        }

        /* تحسين التجاوب الكلي للهواتف الذكية */
        @media (max-width: 768px) {
            .back-btn { display: inline-block; }
            
            .sidebar {
                width: 100%;
                position: absolute;
                top: 0;
                left: 0;
                transform: translateX(0);
            }

            .chat-area {
                width: 100%;
                position: absolute;
                top: 0;
                left: 0;
                transform: translateX(100%);
                transition: transform 0.25s ease-in-out;
            }

            /* التبديل السلس بين القائمة والشات بالموبايل */
            .app-container.chat-active .sidebar {
                transform: translateX(-100%);
            }
            .app-container.chat-active .chat-area {
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--matrix-dark); }
    </style>
</head>
<body>

    <div class="system-log" id="sysLog">SYS_ONLINE | PING: 12ms</div>

    <div class="app-container" id="appContainer">
        
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="loginScreen" class="screen">
            <div class="card-box">
                <h2>[ SECURE LOGIN ]</h2>
                <button class="btn" onclick="loginWithGoogle()">> GOOGLE AUTH</button>
            </div>
        </div>

        <!-- 2. شاشة إكمال الملف -->
        <div id="profileScreen" class="screen hidden">
            <div class="card-box">
                <h2>[ CONFIGURE ID ]</h2>
                <div id="profileError" style="color: var(--danger); margin-bottom:10px; font-size: 12px;"></div>
                <input type="text" id="fullName" placeholder="> FULL_NAME">
                <input type="text" id="username" placeholder="> USERNAME">
                <input type="text" id="uniqueId" placeholder="> 4_DIGIT_PIN" maxlength="4">
                <button class="btn" onclick="saveProfile()">> INITIALIZE</button>
            </div>
        </div>

        <!-- 3. الشاشة الرئيسية -->
        <div id="mainScreen" class="screen hidden" style="padding: 0;">
            <div class="chat-layout">
                
                <!-- الشريط الجانبي -->
                <div class="sidebar" id="sidebarArea">
                    <div class="sidebar-header">
                        <div class="profile-row">
                            <div><span style="color:#fff" id="myNameDisplay">...</span> <span id="myIdDisplay" style="color:var(--matrix-dark)"></span></div>
                            <button class="small-btn" onclick="logout()">EXIT</button>
                        </div>
                        <div class="search-box">
                            <input type="text" id="searchIdInput" placeholder="> SEARCH 4-DIGIT ID" oninput="searchUser()">
                        </div>
                    </div>
                    
                    <div id="searchResultsArea" style="display: none;">
                        <div class="section-title">SEARCH_RESULT:</div>
                        <div class="users-list" id="searchContainer"></div>
                    </div>

                    <div id="recentChatsArea">
                        <div class="section-title">SAVED_CHATS:</div>
                        <div class="users-list" id="recentChatsContainer">
                            <div style="padding:15px; font-size:11px; color:var(--matrix-dark)">NO_CHATS_YET</div>
                        </div>
                    </div>
                </div>

                <!-- منطقة الشات -->
                <div class="chat-area">
                    <div class="chat-header">
                        <div style="display:flex; align-items:center; overflow:hidden;">
                            <button class="back-btn" onclick="closeMobileChat()">◀ BACK</button>
                            <span id="activeChatHeader" style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">SELECT_TARGET</span>
                        </div>
                        <button class="small-btn" onclick="clearTerminal()" id="clearBtn" style="display:none;">CLEAR</button>
                    </div>
                    
                    <div class="messages-box" id="messagesBox">
                        <div style="text-align:center; opacity:0.4; margin-top:40px; font-size:12px;">ENCRYPTED CHANNEL READY</div>
                    </div>
                    
                    <div class="chat-input-box" id="chatInputArea" style="display: none;">
                        <input type="text" id="messageInput" placeholder="> TYPE_MSG..." onkeypress="checkEnter(event)">
                        <button class="btn" onclick="sendMessage()">SEND</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcqJlqxeCxehWuBlRsrIpL77ClTOYvgXo",
            authDomain: "program-73193.firebaseapp.com",
            projectId: "program-73193",
            storageBucket: "program-73193.firebasestorage.app",
            messagingSenderId: "98054437932",
            appId: "1:98054437932:web:ae2cc80b4eefc14873a589",
            measurementId: "G-QVXBGN8HQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let activeChatUser = null;
        let unsubscribeMessages = null;

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } catch (e) {}
        };

        window.logout = async function() {
            await signOut(auth);
            window.location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        showMainScreen();
                        renderRecentChats();
                    } else {
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('profileScreen').classList.remove('hidden');
                    }
                });
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
            }
        });

        window.saveProfile = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const uniqueId = document.getElementById('uniqueId').value.trim();
            const errorDiv = document.getElementById('profileError');

            if (!fullName || !username || !uniqueId) { errorDiv.innerText = "FILL_ALL_FIELDS"; return; }
            if (uniqueId.length !== 4 || isNaN(uniqueId)) { errorDiv.innerText = "PIN_MUST_BE_4_DIGITS"; return; }

            const q = query(collection(db, "users"), where("uniqueId", "==", uniqueId));
            const snap = await getDocs(q);
            if (!snap.empty) { errorDiv.innerText = "ID_ALREADY_TAKEN"; return; }

            userData = { uid: currentUser.uid, fullName, username, uniqueId, recentChats: [] };
            await setDoc(doc(db, "users", currentUser.uid), userData);
            showMainScreen();
        };

        function showMainScreen() {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = userData.fullName;
            document.getElementById('myIdDisplay').innerText = `#${userData.uniqueId}`;
        }

        function renderRecentChats() {
            const container = document.getElementById('recentChatsContainer');
            if (!userData.recentChats || userData.recentChats.length === 0) {
                container.innerHTML = `<div style="padding:12px; font-size:11px; color:var(--matrix-dark)">NO_CHATS</div>`;
                return;
            }
            container.innerHTML = '';
            [...userData.recentChats].reverse().forEach(user => {
                container.innerHTML += `
                    <div class="user-item" onclick='selectUser(${JSON.stringify(user)})'>
                        <h4>> ${user.fullName}</h4>
                        <span>#${user.uniqueId}</span>
                    </div>
                `;
            });
        }

        window.searchUser = async function() {
            const queryText = document.getElementById('searchIdInput').value.trim();
            const searchArea = document.getElementById('searchResultsArea');
            const recentArea = document.getElementById('recentChatsArea');
            const container = document.getElementById('searchContainer');

            if (queryText.length === 0) {
                searchArea.style.display = 'none';
                recentArea.style.display = 'block';
                return;
            }

            searchArea.style.display = 'block';
            recentArea.style.display = 'none';
            container.innerHTML = '';

            const q = query(collection(db, "users"), where("uniqueId", "==", queryText));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                container.innerHTML = `<div style="padding:12px; font-size:11px; color:var(--danger)">NOT_FOUND</div>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const user = docSnap.data();
                if (user.uid !== currentUser.uid) {
                    container.innerHTML += `
                        <div class="user-item" onclick='selectUser(${JSON.stringify(user)})'>
                            <h4>> ${user.fullName}</h4>
                            <span>#${user.uniqueId}</span>
                        </div>
                    `;
                }
            });
        };

        window.selectUser = function(user) {
            activeChatUser = user;
            document.getElementById('activeChatHeader').innerHTML = `${user.fullName} <span style="color:var(--matrix-dark)">(#${user.uniqueId})</span>`;
            document.getElementById('chatInputArea').style.display = 'flex';
            document.getElementById('clearBtn').style.display = 'block';
            
            // تفعيل الشاشة للموبايل
            document.getElementById('appContainer').classList.add('chat-active');
            loadMessages();
        };

        window.closeMobileChat = function() {
            document.getElementById('appContainer').classList.remove('chat-active');
        };

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            input.value = ''; 

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: text,
                senderId: currentUser.uid,
                timestamp: Date.now()
            });

            const chatObjForMe = { uid: activeChatUser.uid, fullName: activeChatUser.fullName, uniqueId: activeChatUser.uniqueId, username: activeChatUser.username };
            const chatObjForThem = { uid: currentUser.uid, fullName: userData.fullName, uniqueId: userData.uniqueId, username: userData.username };
            
            await updateDoc(doc(db, "users", currentUser.uid), { recentChats: arrayUnion(chatObjForMe) });
            await updateDoc(doc(db, "users", activeChatUser.uid), { recentChats: arrayUnion(chatObjForThem) });
        };

        window.checkEnter = function(e) { if (e.key === 'Enter') sendMessage(); };

        window.clearTerminal = function() {
            document.getElementById('messagesBox').innerHTML = `<div style="text-align:center; opacity:0.4; margin-top:40px; font-size:12px;">LOGS_CLEARED</div>`;
        };

        function formatTime(ms) {
            const d = new Date(ms);
            let h = d.getHours(), m = d.getMinutes();
            m = m < 10 ? '0'+m : m;
            return `${h}:${m}`;
        }

        function loadMessages() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            const messagesBox = document.getElementById('messagesBox');

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesBox.innerHTML = '';
                if (snapshot.empty) {
                    messagesBox.innerHTML = `<div style="text-align:center; opacity:0.4; margin-top:40px; font-size:12px;">SECURE_LOGS_EMPTY</div>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    messagesBox.innerHTML += `
                        <div class="message ${isMe ? 'sent' : 'received'}">
                            ${msg.text}
                            <span class="msg-time">${formatTime(msg.timestamp)}</span>
                        </div>
                    `;
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
