<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الدردشة الاحترافي</title>
    <!-- استيراد خط كاييرو العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background: var(--bg-panel);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* الشاشات العامة */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            z-index: -1;
        }

        /* بطاقات الدخول وإكمال الملف */
        .card-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 25px;
            color: var(--text-main);
            font-weight: 700;
            font-size: 24px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .google-btn {
            background: #ffffff;
            color: #1f2937;
            font-weight: 700;
        }

        .google-btn:hover {
            background: #e5e7eb;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* تصميم الشات الرئيسي */
        .chat-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 340px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(17, 24, 39, 0.7);
        }

        .user-profile-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-profile-info h4 {
            font-size: 16px;
            color: var(--text-main);
        }

        .user-profile-info span {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .search-box input {
            margin-bottom: 0;
            font-size: 14px;
            padding: 10px 14px;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .user-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            background: transparent;
        }

        .user-item:hover, .user-item.active {
            background: var(--bg-card);
            border-color: var(--border);
        }

        .user-item h4 {
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .user-item span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 18px 25px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messages-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.sent {
            background: var(--accent);
            color: white;
            align-self: flex-start; /* في الـ RTL تظهر يميناً */
            border-bottom-left-radius: 4px;
        }

        .message.received {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-end; /* في الـ RTL تظهر يساراً */
            border-bottom-right-radius: 4px;
            border: 1px solid var(--border);
        }

        .chat-input-box {
            padding: 20px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .chat-input-box input {
            margin-bottom: 0;
        }

        .chat-input-box .btn {
            width: 120px;
        }

        .error-text {
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 15px;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .logout-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* شريط التمرير المخصص */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="loginScreen" class="screen">
            <div class="card-box">
                <h2>تسجيل الدخول</h2>
                <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 14px;">تواصل بحرية وبأمان تام عبر الأرقام التعريفية</p>
                <button class="btn google-btn" onclick="loginWithGoogle()">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.21 21.34 7.27 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.6H1.2C.43 8.14 0 9.99 0 12s.43 3.86 1.2 5.4l4.07-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.27 0 3.21 2.66 1.2 6.6l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                    تسجيل الدخول بواسطة جوجل
                </button>
            </div>
        </div>

        <!-- 2. شاشة إكمال الملف الشخصي -->
        <div id="profileScreen" class="screen hidden">
            <div class="card-box">
                <h2>إعداد الملف الشخصي</h2>
                <div id="profileError" class="error-text" style="display: none;"></div>
                <input type="text" id="fullName" placeholder="الاسم الكامل">
                <input type="text" id="username" placeholder="اسم المستخدم (Username)">
                <input type="text" id="uniqueId" placeholder="الرقم التعريفي (4 أرقام فقط)" maxlength="4">
                <button class="btn" onclick="saveProfile()">حفظ والبدء فوراً</button>
            </div>
        </div>

        <!-- 3. الشاشة الرئيسية للدردشة -->
        <div id="mainScreen" class="screen hidden" style="padding: 0;">
            <div class="chat-layout">
                <!-- الشريط الجانبي والبحث -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <div class="user-profile-info">
                            <div>
                                <h4 id="myNameDisplay">جاري التحميل...</h4>
                                <span id="myIdDisplay">#0000</span>
                            </div>
                            <button class="logout-btn" onclick="logout()">خروج</button>
                        </div>
                        <div class="search-box">
                            <input type="text" id="searchIdInput" placeholder="بحث بالرقم التعريفي (4 أرقام)..." oninput="searchUser()">
                        </div>
                    </div>
                    <div class="users-list" id="usersListContainer">
                        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">
                            ابحث عن شخص برقمة التعريفي للبدء
                        </div>
                    </div>
                </div>

                <!-- منطقة المحادثة النصية البحتة -->
                <div class="chat-area">
                    <div class="chat-header" id="activeChatHeader">
                        <span>💬 اختر شخصاً من القائمة الجانبية لبدء المحادثة</span>
                    </div>
                    <div class="messages-box" id="messagesBox">
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%; color: var(--text-muted); font-size: 14px;">
                            لا توجد رسائل محددة حالياً
                        </div>
                    </div>
                    <div class="chat-input-box" id="chatInputArea" style="display: none;">
                        <input type="text" id="messageInput" placeholder="اكتب رسالة نصية هنا..." onkeypress="checkEnter(event)">
                        <button class="btn" onclick="sendMessage()">إرسال</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- كود المنطق والربط مع فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcqJlqxeCxehWuBlRsrIpL77ClTOYvgXo",
            authDomain: "program-73193.firebaseapp.com",
            projectId: "program-73193",
            storageBucket: "program-73193.firebasestorage.app",
            messagingSenderId: "98054437932",
            appId: "1:98054437932:web:ae2cc80b4eefc14873a589",
            measurementId: "G-QVXBGN8HQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let activeChatUser = null;
        let unsubscribeMessages = null;

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("خطأ في تسجيل الدخول", error);
            }
        };

        window.logout = async function() {
            await signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    userData = userDoc.data();
                    showMainScreen();
                } else {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('profileScreen').classList.remove('hidden');
                }
            } else {
                currentUser = null;
                userData = null;
                activeChatUser = null;
                if (unsubscribeMessages) unsubscribeMessages();
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
            }
        });

        window.saveProfile = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const uniqueId = document.getElementById('uniqueId').value.trim();
            const errorDiv = document.getElementById('profileError');

            if (!fullName || !username || !uniqueId) {
                errorDiv.innerText = "الرجاء تعبئة جميع الحقول المطلوبة";
                errorDiv.style.display = 'block';
                return;
            }

            if (uniqueId.length !== 4 || isNaN(uniqueId)) {
                errorDiv.innerText = "الرقم التعريفي يجب أن يكون مكوناً من 4 أرقام فقط";
                errorDiv.style.display = 'block';
                return;
            }

            const q = query(collection(db, "users"), where("uniqueId", "==", uniqueId));
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                errorDiv.innerText = "هذا الرقم التعريفي مستخدم مسبقاً، اختر رقماً آخر غير مستخدم";
                errorDiv.style.display = 'block';
                return;
            }

            userData = {
                uid: currentUser.uid,
                fullName,
                username,
                uniqueId
            };

            await setDoc(doc(db, "users", currentUser.uid), userData);
            showMainScreen();
        };

        function showMainScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = userData.fullName;
            document.getElementById('myIdDisplay').innerText = `#${userData.uniqueId}`;
        }

        window.searchUser = async function() {
            const queryText = document.getElementById('searchIdInput').value.trim();
            const listContainer = document.getElementById('usersListContainer');
            listContainer.innerHTML = '';

            if (queryText.length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">ابحث عن شخص برقمة التعريفي للبدء</div>`;
                return;
            }

            const q = query(collection(db, "users"), where("uniqueId", "==", queryText));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 20px; font-size: 13px;">لا يوجد مستخدم بهذا الرقم</div>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const user = docSnap.data();
                if (user.uid !== currentUser.uid) {
                    listContainer.innerHTML += `
                        <div class="user-item" onclick='selectUser(${JSON.stringify(user)})'>
                            <h4>${user.fullName}</h4>
                            <span>#${user.uniqueId} &bull; @${user.username}</span>
                        </div>
                    `;
                }
            });
        };

        window.selectUser = function(user) {
            activeChatUser = user;
            document.getElementById('activeChatHeader').innerHTML = `المحادثة مع: <span style="color: var(--accent); margin-right: 5px;">${user.fullName}</span> <span style="font-size: 12px; color: var(--text-muted); margin-right: 10px;">(#${user.uniqueId})</span>`;
            document.getElementById('chatInputArea').style.display = 'flex';
            loadMessages();
        };

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');

            input.value = ''; // تفريغ الحقل فوراً لسرعة الاستجابة

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: text,
                senderId: currentUser.uid,
                timestamp: Date.now()
            });
        };

        window.checkEnter = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };

        function loadMessages() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            const messagesBox = document.getElementById('messagesBox');

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesBox.innerHTML = '';
                if (snapshot.empty) {
                    messagesBox.innerHTML = `<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: var(--text-muted); font-size: 14px;">لا توجد رسائل سابقة. ابدأ المحادثة الآن!</div>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    messagesBox.innerHTML += `
                        <div class="message ${isMe ? 'sent' : 'received'}">
                            ${msg.text}
                        </div>
                    `;
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
