<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ULTIMATE CYBER TERMINAL v8.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --matrix-green: #00ff66;
            --matrix-dark: #004d1a;
            --danger: #ff1e4d;
            --warning: #ffb700;
            --border-glow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* أنماط الثيمات المتعددة */
        body.theme-cyber { --matrix-green: #00ff66; --matrix-dark: #004d1a; --border-glow: 0 0 15px rgba(0, 255, 102, 0.4); }
        body.theme-red { --matrix-green: #ff1e4d; --matrix-dark: #4d0012; --border-glow: 0 0 15px rgba(255, 30, 77, 0.4); }
        body.theme-blue { --matrix-green: #00e5ff; --matrix-dark: #00434d; --border-glow: 0 0 15px rgba(0, 229, 255, 0.4); }
        body.theme-amber { --matrix-green: #ffb700; --matrix-dark: #4d3600; --border-glow: 0 0 15px rgba(255, 183, 0, 0.4); }

        /* تأثيرات كلاسيكية تيرمنال متطورة */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.008), rgba(0, 0, 255, 0.01));
            z-index: 99999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--matrix-green);
            width: 100%;
            height: 100dvh; /* تم التعديل لتتطابق تماماً مع شاشات الموبايل بدون فراغات */
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .sys-bar {
            position: absolute;
            top: env(safe-area-inset-top, 4px);
            right: 10px;
            font-size: 8px;
            color: var(--matrix-dark);
            z-index: 100000;
            display: flex;
            gap: 6px;
        }

        .screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .screen.hidden {
            display: none !important;
        }

        .box {
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--matrix-green);
            padding: 25px 20px;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.15);
            background: #010502;
            text-align: center;
        }

        h2 { font-size: 18px; margin-bottom: 18px; letter-spacing: 1.5px; }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: #000;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 16px; /* منع التكبير التلقائي في الآيفون */
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-green);
            box-shadow: var(--border-glow);
        }

        .btn {
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 13px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:active { background: var(--matrix-green); color: #000; }

        .mobile-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .pane {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #chatPane {
            transform: translateX(100%);
            z-index: 30;
        }

        .app-container.in-chat #chatPane { transform: translateX(0); }
        .app-container.in-chat #homePane { transform: translateX(-100%); }

        .pane-header {
            padding: env(safe-area-inset-top, 8px) 15px 10px 15px;
            border-bottom: 1px solid var(--matrix-dark);
            background: #020803;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            flex-shrink: 0;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .user-row {
            padding: 15px;
            border-bottom: 1px solid #001a05;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .user-row:active { background: #002608; }

        .messages-area {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #000;
            position: relative;
        }

        .msg {
            max-width: 82%;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            border-radius: 4px;
        }

        .msg.sent {
            align-self: flex-start;
            border-right: 3px solid var(--matrix-green);
            background: #001405;
        }

        .msg.received {
            align-self: flex-end;
            border-left: 3px solid var(--matrix-dark);
            background: #050805;
            color: #d1d1d1;
        }

        .msg-time {
            font-size: 8px;
            display: block;
            margin-top: 4px;
            opacity: 0.6;
            text-align: left;
        }

        .quick-payloads {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            background: #010602;
            border-top: 1px dashed var(--matrix-dark);
            overflow-x: auto;
            flex-shrink: 0;
        }

        .payload-chip {
            background: transparent;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 10px;
            padding: 5px 10px;
            white-space: nowrap;
            cursor: pointer;
        }

        .input-bar {
            padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px)) 10px;
            border-top: 2px solid var(--matrix-green);
            background: #000000;
            display: flex;
            gap: 8px;
            width: 100%;
            flex-shrink: 0;
            align-items: center;
            z-index: 100;
        }

        .input-bar input {
            margin-bottom: 0;
            flex: 1;
            padding: 12px;
            font-size: 16px;
            background: #030503;
            height: 48px;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
        }

        .input-bar .btn {
            width: 90px;
            padding: 0;
            font-size: 13px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-btn {
            background: transparent;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-dark);
            padding: 5px 9px;
            font-size: 10px;
            cursor: pointer;
        }
        .mini-btn:hover { border-color: var(--matrix-green); color: var(--matrix-green); }

        .error-msg { color: var(--danger); font-size: 11px; margin-bottom: 10px; }

        /* نافذة الألعاب والأدوات السيبرانية المنبثقة */
        #modalOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box {
            width: 100%; max-width: 340px; border: 1px solid var(--matrix-green); background: #020803; padding: 20px; text-align: center;
        }
    </style>
</head>
<body class="theme-cyber">

    <div class="sys-bar">
        <span id="pingStat">PING: 14ms</span> | 
        <span id="batteryStat">BAT: --%</span> | 
        <span id="secureStatus">GRID: ONLINE</span> | 
        <span id="clockStat">00:00</span>
    </div>

    <!-- نافذة منبثقة للأدوات والألعاب -->
    <div id="modalOverlay" class="hidden">
        <div class="modal-box" id="modalContent">
            <!-- المحتوى يتم توليده ديناميكياً -->
        </div>
    </div>

    <div class="app-container" id="appContainer">
        
        <!-- 1. شاشة الدخول -->
        <div id="loginScreen" class="screen">
            <div class="box">
                <h2>[ SECURE GATEWAY v8.5 ]</h2>
                <button class="btn" onclick="loginWithGoogle()">> GOOGLE AUTH</button>
            </div>
        </div>

        <!-- 2. شاشة البروفايل -->
        <div id="profileScreen" class="screen hidden">
            <div class="box">
                <h2>[ CONFIG PROFILE ]</h2>
                <div id="profileError" class="error-msg"></div>
                <input type="text" id="fullName" placeholder="> FULL NAME">
                <input type="text" id="username" placeholder="> ALIAS">
                <input type="text" id="uniqueId" placeholder="> 4-DIGIT PIN" maxlength="4">
                <button class="btn" onclick="saveProfile()">> DEPLOY ID</button>
            </div>
        </div>

        <!-- 3. الشاشة الرئيسية -->
        <div id="mainScreen" class="screen hidden" style="padding: 0;">
            <div class="mobile-view">
                
                <!-- القائمة والبحث -->
                <div class="pane" id="homePane">
                    <div class="pane-header">
                        <div>
                            <span id="myNameDisplay" style="color:#fff; font-size:13px;" onclick="copyMyId()">...</span>
                            <span id="myIdDisplay" style="color:var(--matrix-dark); font-size:11px;"></span>
                        </div>
                        <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">
                            <button class="mini-btn" onclick="toggleTheme()">THEME</button>
                            <button class="mini-btn" onclick="openHackerGame()">GAME</button>
                            <button class="mini-btn" onclick="openToolsMenu()">TOOLS</button>
                            <button class="mini-btn" onclick="runDiagnostics()">DIAG</button>
                            <button class="mini-btn" onclick="logout()" style="border-color:var(--danger); color:var(--danger);">EXIT</button>
                        </div>
                    </div>
                    <div style="padding: 10px; background: #000; border-bottom: 1px solid var(--matrix-dark); flex-shrink: 0;">
                        <input type="text" id="searchIdInput" placeholder="> SEARCH 4-DIGIT ID..." oninput="searchUser()" style="margin-bottom:0;">
                    </div>
                    <div class="list-container" id="mainListContainer">
                        <div style="padding:20px; font-size:11px; color:var(--matrix-dark); text-align:center;">NO_CHANNELS_OPEN</div>
                    </div>
                </div>

                <!-- شاشة الدردشة الثابتة -->
                <div class="pane" id="chatPane">
                    <div class="pane-header">
                        <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
                            <button class="mini-btn" onclick="closeChat()">◀ BACK</button>
                            <span id="activeChatTitle" style="font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">TARGET</span>
                        </div>
                        <div style="display:flex; gap:4px;">
                            <button class="mini-btn" onclick="exportChatTranscript()">EXPORT</button>
                            <button class="mini-btn" onclick="clearScreenLogs()">WIPE</button>
                        </div>
                    </div>
                    
                    <div class="messages-area" id="messagesBox">
                        <div style="text-align:center; opacity:0.3; margin-top:30px; font-size:11px;">SECURE TUNNEL ACTIVE</div>
                    </div>

                    <div id="typingIndicator" style="font-size:10px; color:var(--matrix-dark); padding:2px 10px; height:18px;"></div>

                    <!-- شريط الأوامر السريعة المتقدمة -->
                    <div class="quick-payloads">
                        <button class="payload-chip" onclick="sendPayload('[بروتوكول: فحص استقرار البوابة]')">> فحص استقرار</button>
                        <button class="payload-chip" onclick="sendPayload('[بروتوكول: طلب مزامنة البيانات]')">> مزامنة</button>
                        <button class="payload-chip" onclick="sendPayload('[تحذير: تم الكشف عن اتصال آمن]')">> تحذير أمني</button>
                        <button class="payload-chip" onclick="sendPayload('[تأكيد: تم قطع الجلسة بنجاح]')">> قطع الجلسة</button>
                    </div>
                    
                    <!-- شريط الإدخال الثابت -->
                    <div class="input-bar">
                        <input type="text" id="messageInput" placeholder="> TYPE MESSAGE..." autocomplete="off" oninput="notifyTyping()" onkeypress="onEnterPress(event)">
                        <button class="btn" onclick="sendTextMessage()">SEND</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, arrayUnion, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcqJlqxeCxehWuBlRsrIpL77ClTOYvgXo",
            authDomain: "program-73193.firebaseapp.com",
            projectId: "program-73193",
            storageBucket: "program-73193.firebasestorage.app",
            messagingSenderId: "98054437932",
            appId: "1:98054437932:web:ae2cc80b4eefc14873a589",
            measurementId: "G-QVXBGN8HQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let activeChatUser = null;
        let messagesUnsubscribe = null;
        let typingTimeout = null;

        // نظام الساعة، الـ Ping والبطارية
        setInterval(() => {
            const d = new Date();
            document.getElementById('clockStat').innerText = `${d.getHours()}:${d.getMinutes()<10?'0':''}${d.getMinutes()}`;
            document.getElementById('pingStat').innerText = `PING: ${Math.floor(Math.random() * 20 + 8)}ms`;
        }, 2000);

        if (navigator.getBattery) {
            navigator.getBattery().then(bat => {
                const updateBat = () => document.getElementById('batteryStat').innerText = `BAT: ${Math.floor(bat.level * 100)}%`;
                updateBat();
                bat.addEventListener('levelchange', updateBat);
            });
        }

        // تبديل الثيمات (الأخضر، الأحمر، الأزرق، العنبري)
        const themes = ['theme-cyber', 'theme-red', 'theme-blue', 'theme-amber'];
        window.toggleTheme = function() {
            const currentTheme = themes.find(t => document.body.classList.contains(t)) || 'theme-cyber';
            const nextTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
            document.body.classList.remove(...themes);
            document.body.classList.add(nextTheme);
        };

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } catch(e) {}
        };

        window.logout = async function() {
            await signOut(auth);
            window.location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        showDashboard();
                        renderChatList();
                    } else {
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('profileScreen').classList.remove('hidden');
                    }
                });
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
            }
        });

        window.saveProfile = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const uniqueId = document.getElementById('uniqueId').value.trim();
            const errDiv = document.getElementById('profileError');

            if (!fullName || !username || !uniqueId) { errDiv.innerText = "ERROR: FIELDS REQUIRED"; return; }
            if (uniqueId.length !== 4 || isNaN(uniqueId)) { errDiv.innerText = "ERROR: PIN MUST BE 4 DIGITS"; return; }

            const q = query(collection(db, "users"), where("uniqueId", "==", uniqueId));
            const snap = await getDocs(q);
            if (!snap.empty) { errDiv.innerText = "ERROR: PIN ALREADY TAKEN"; return; }

            userData = { uid: currentUser.uid, fullName, username, uniqueId, recentChats: [] };
            await setDoc(doc(db, "users", currentUser.uid), userData);
            showDashboard();
        };

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = `> ${userData.fullName}`;
            document.getElementById('myIdDisplay').innerText = `PIN: #${userData.uniqueId}`;
        }

        window.copyMyId = function() {
            navigator.clipboard.writeText(userData.uniqueId);
            alert("COPIED PIN: #" + userData.uniqueId);
        };

        window.runDiagnostics = function() {
            alert("DIAGNOSTICS: ALL SECURE NODES ACTIVE & SYNCED\nDATABASE: FIRESTORE SECURE\nENCRYPTION: AES-256 SIMULATED");
        };

        function renderChatList() {
            const container = document.getElementById('mainListContainer');
            const chats = userData.recentChats || [];

            if (chats.length === 0) {
                container.innerHTML = `<div style="padding:20px; font-size:11px; color:var(--matrix-dark); text-align:center;">NO_SAVED_CHANNELS</div>`;
                return;
            }

            container.innerHTML = '';
            [...chats].reverse().forEach(u => {
                container.innerHTML += `
                    <div class="user-row" onclick='openChatWindow(${JSON.stringify(u)})'>
                        <div>
                            <h4 style="font-size:13px; color:#fff;">> ${u.fullName}</h4>
                            <span style="font-size:10px; color:var(--matrix-dark);">PIN: #${u.uniqueId}</span>
                        </div>
                        <span style="font-size:10px; color:var(--matrix-green);">CONNECT ▶</span>
                    </div>
                `;
            });
        }

        window.searchUser = async function() {
            const queryText = document.getElementById('searchIdInput').value.trim();
            if (queryText.length === 0) {
                renderChatList();
                return;
            }

            const q = query(collection(db, "users"), where("uniqueId", "==", queryText));
            const snap = await getDocs(q);
            const container = document.getElementById('mainListContainer');

            if (snap.empty) {
                container.innerHTML = `<div style="padding:20px; font-size:11px; color:var(--danger); text-align:center;">TARGET_NOT_FOUND</div>`;
                return;
            }

            container.innerHTML = '';
            snap.forEach(docSnap => {
                const u = docSnap.data();
                if (u.uid !== currentUser.uid) {
                    container.innerHTML += `
                        <div class="user-row" onclick='openChatWindow(${JSON.stringify(u)})'>
                            <div>
                                <h4 style="font-size:13px; color:#fff;">> ${u.fullName}</h4>
                                <span style="font-size:10px; color:var(--matrix-dark);">PIN: #${u.uniqueId}</span>
                            </div>
                            <span style="font-size:10px; color:var(--matrix-green);">INITIATE ▶</span>
                        </div>
                    `;
                }
            });
        };

        window.openChatWindow = function(targetUser) {
            activeChatUser = targetUser;
            document.getElementById('activeChatTitle').innerText = `${targetUser.fullName} (#${targetUser.uniqueId})`;
            document.getElementById('appContainer').classList.add('in-chat');
            loadActiveMessages();
            listenToTypingStatus();
        };

        window.closeChat = function() {
            document.getElementById('appContainer').classList.remove('in-chat');
            activeChatUser = null;
            if (messagesUnsubscribe) messagesUnsubscribe();
            renderChatList();
        };

        window.sendPayload = function(txt) {
            document.getElementById('messageInput').value = txt;
            sendTextMessage();
        };

        window.sendTextMessage = async function() {
            const inputField = document.getElementById('messageInput');
            const txt = inputField.value.trim();
            if (!txt || !activeChatUser) return;

            inputField.value = '';

            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: txt,
                senderId: currentUser.uid,
                timestamp: Date.now()
            });

            const myObj = { uid: currentUser.uid, fullName: userData.fullName, uniqueId: userData.uniqueId, username: userData.username };
            const targetObj = { uid: activeChatUser.uid, fullName: activeChatUser.fullName, uniqueId: activeChatUser.uniqueId, username: activeChatUser.username };

            await updateDoc(doc(db, "users", currentUser.uid), { recentChats: arrayUnion(targetObj) });
            await updateDoc(doc(db, "users", activeChatUser.uid), { recentChats: arrayUnion(myObj) });
        };

        window.onEnterPress = function(e) { if (e.key === 'Enter') sendTextMessage(); };
        window.clearScreenLogs = function() { document.getElementById('messagesBox').innerHTML = `<div style="text-align:center; opacity:0.3; margin-top:30px; font-size:11px;">BUFFER_CLEARED</div>`; };

        function formatHour(ms) {
            const d = new Date(ms);
            return `${d.getHours()}:${d.getMinutes() < 10 ? '0'+d.getMinutes() : d.getMinutes()}`;
        }

        function loadActiveMessages() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            const box = document.getElementById('messagesBox');

            if (messagesUnsubscribe) messagesUnsubscribe();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                box.innerHTML = '';
                if (snapshot.empty) {
                    box.innerHTML = `<div style="text-align:center; opacity:0.3; margin-top:30px; font-size:11px;">NO_PACKETS_YET</div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    const mine = m.senderId === currentUser.uid;
                    box.innerHTML += `
                        <div class="msg ${mine ? 'sent' : 'received'}">
                            ${m.text}
                            <span class="msg-time">${formatHour(m.timestamp)}</span>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // ميزة مؤشر الكتابة وتصدير الدردشة
        window.notifyTyping = async function() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            await setDoc(doc(db, "typing", chatId), { [currentUser.uid]: true }, { merge: true });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(async () => {
                await setDoc(doc(db, "typing", chatId), { [currentUser.uid]: false }, { merge: true });
            }, 1500);
        };

        function listenToTypingStatus() {
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            onSnapshot(doc(db, "typing", chatId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const targetTyping = data[activeChatUser.uid];
                    document.getElementById('typingIndicator').innerText = targetTyping ? "[TARGET_IS_TYPING...]" : "";
                }
            });
        }

        window.exportChatTranscript = function() {
            const box = document.getElementById('messagesBox');
            const text = box.innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cyber-log-${activeChatUser.uniqueId}.txt`;
            a.click();
        };

        // الأدوات والألعاب السيبرانية المنبثقة
        window.openToolsMenu = function() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.remove('hidden');
            content.innerHTML = `
                <h3 style="margin-bottom:15px; font-size:15px;">[ CYBER TOOLS ]</h3>
                <button class="btn" style="margin-bottom:8px;" onclick="genPassword()">> توليد كلمة مرور آمنة</button>
                <button class="btn" style="margin-bottom:8px;" onclick="runIpLookup()">> فحص عنوان IP وهمي</button>
                <button class="btn" onclick="closeModal()">> إغلاق</button>
            `;
        };

        window.genPassword = function() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
            let pass = "";
            for (let i = 0; i < 12; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            alert("Generated Secure Pass: " + pass);
            navigator.clipboard.writeText(pass);
        };

        window.runIpLookup = function() {
            const ip = `${Math.floor(Math.random()*200+10)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
            alert(`IP Info:\nAddress: ${ip}\nStatus: SECURED & PROXY ACTIVE\nLocation: SECRETS_GRID`);
        };

        window.openHackerGame = function() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.remove('hidden');
            const secretNum = Math.floor(Math.random() * 10 + 1);
            content.innerHTML = `
                <h3 style="margin-bottom:10px; font-size:15px;">[ HACKER MINI-GAME ]</h3>
                <p style="font-size:12px; margin-bottom:12px; color:var(--matrix-dark);">تخمين رقم النظام السري (بين 1 و 10)</p>
                <input type="number" id="gameGuess" placeholder="> أدخل الرقم" style="margin-bottom:10px;">
                <button class="btn" style="margin-bottom:8px;" onclick="checkGameGuess(${secretNum})">> تخمين</button>
                <button class="btn" onclick="closeModal()">> إغلاق</button>
            `;
        };

        window.checkGameGuess = function(target) {
            const val = parseInt(document.getElementById('gameGuess').value);
            if (val === target) {
                alert("ACCESS GRANTED! تم فك شفرة النظام بنجاح!");
                closeModal();
            } else {
                alert("ACCESS DENIED! خطأ في الشفرة، حاول مجدداً.");
            }
        };

        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.add('hidden');
        };
    </script>
</body>
</html>
