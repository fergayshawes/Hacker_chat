<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE TERMINAL CHAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --matrix-green: #00ff41;
            --matrix-dark: #008f11;
            --border-glow: 0 0 10px rgba(0, 255, 65, 0.5);
            --danger: #ff003c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace; /* خط الهاكرز */
        }

        body {
            background-color: var(--bg-color);
            color: var(--matrix-green);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            height: 95vh;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--matrix-green);
            box-shadow: var(--border-glow);
            display: flex;
            position: relative;
        }

        /* Terminal Header Log */
        .system-log {
            position: absolute;
            top: -25px;
            left: 10px;
            font-size: 12px;
            color: var(--matrix-dark);
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .screen.hidden {
            display: none !important;
        }

        .card-box {
            background: transparent;
            padding: 40px;
            border: 1px solid var(--matrix-green);
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn {
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--matrix-green);
            color: var(--bg-color);
            box-shadow: var(--border-glow);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: transparent;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-green);
            box-shadow: inset 0 0 5px rgba(0, 255, 65, 0.5);
        }
        
        input::placeholder {
            color: var(--matrix-dark);
        }

        /* Layout */
        .chat-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 320px;
            border-left: 1px solid var(--matrix-dark);
            display: flex;
            flex-direction: column;
            background: rgba(0, 20, 0, 0.3);
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--matrix-dark);
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box input { margin-bottom: 0; }

        .section-title {
            padding: 10px 15px;
            font-size: 12px;
            color: var(--matrix-dark);
            border-bottom: 1px dashed var(--matrix-dark);
            background: black;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 15px;
            border-bottom: 1px solid #002200;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: #001a00;
            border-left: 3px solid var(--matrix-green);
        }

        .user-item h4 { font-size: 15px; margin-bottom: 5px; }
        .user-item span { font-size: 12px; color: var(--matrix-dark); }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--matrix-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: none; /* يظهر بس ع الموبايل */
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 5px 10px;
            cursor: pointer;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 10px 15px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .msg-time {
            font-size: 10px;
            display: block;
            margin-top: 5px;
            opacity: 0.7;
        }

        .message.sent {
            align-self: flex-start;
            border-right: 2px solid var(--matrix-green);
            background: #001100;
        }

        .message.received {
            align-self: flex-end;
            border-left: 2px solid var(--matrix-dark);
            background: #000500;
            color: #ccc;
        }

        .chat-input-box {
            padding: 15px;
            border-top: 1px solid var(--matrix-dark);
            display: flex;
            gap: 10px;
        }

        .chat-input-box input { margin-bottom: 0; }
        .chat-input-box .btn { width: 100px; }

        .small-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: 1px solid var(--matrix-dark);
            background: transparent;
            color: var(--matrix-dark);
            cursor: pointer;
        }
        .small-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* سكرول بار الهاكرز */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--matrix-dark); }
        ::-webkit-scrollbar-thumb:hover { background: var(--matrix-green); }

        /* ================================== */
        /* التجاوب مع الموبايل (المهمة اللي طلبتها) */
        /* ================================== */
        @media (max-width: 768px) {
            .app-container { height: 100vh; border: none; box-shadow: none; }
            .chat-layout { position: relative; overflow: hidden; }
            
            .sidebar {
                width: 100%;
                height: 100%;
                position: absolute;
                z-index: 5;
                transition: transform 0.3s ease;
            }
            
            .chat-area {
                width: 100%;
                height: 100%;
                position: absolute;
                z-index: 4; /* تحت القائمة، وتظهر لما القائمة تختفي */
            }

            /* لما نختار شخص، نخفي القائمة بإزاحتها لليمين */
            .sidebar.hide-mobile {
                transform: translateX(100%);
            }
            
            /* إظهار زر الرجوع في الموبايل */
            .back-btn { display: block; margin-left: 10px; }
        }
    </style>
</head>
<body>

    <div class="system-log" id="sysLog">SYSTEM_READY > _</div>

    <div class="app-container">
        
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="loginScreen" class="screen">
            <div class="card-box">
                <h2>[ SECURE LOGIN ]</h2>
                <button class="btn" onclick="loginWithGoogle()">> INITIALIZE GOOGLE AUTH</button>
            </div>
        </div>

        <!-- 2. شاشة إكمال الملف -->
        <div id="profileScreen" class="screen hidden">
            <div class="card-box">
                <h2>[ CONFIGURE ID ]</h2>
                <div id="profileError" style="color: var(--danger); margin-bottom:10px; font-size: 13px;"></div>
                <input type="text" id="fullName" placeholder="> ENTER_FULL_NAME">
                <input type="text" id="username" placeholder="> ENTER_ALIAS (Username)">
                <input type="text" id="uniqueId" placeholder="> SET_4_DIGIT_PIN" maxlength="4">
                <button class="btn" onclick="saveProfile()">> EXECUTE</button>
            </div>
        </div>

        <!-- 3. الشاشة الرئيسية -->
        <div id="mainScreen" class="screen hidden" style="padding: 0;">
            <div class="chat-layout">
                
                <!-- الشريط الجانبي (المحادثات المحفوظة والبحث) -->
                <div class="sidebar" id="sidebarArea">
                    <div class="sidebar-header">
                        <div class="profile-row">
                            <div style="font-size: 14px;">USER: <span id="myNameDisplay" style="color:white">...</span> <br>ID: <span id="myIdDisplay" style="color:var(--matrix-dark)">...</span></div>
                            <button class="small-btn" onclick="logout()">LOGOUT</button>
                        </div>
                        <div class="search-box">
                            <input type="text" id="searchIdInput" placeholder="> SEARCH_TARGET_ID (4 DIGITS)" oninput="searchUser()">
                        </div>
                    </div>
                    
                    <div id="searchResultsArea" style="display: none;">
                        <div class="section-title">TARGET_LOCATED:</div>
                        <div class="users-list" id="searchContainer"></div>
                    </div>

                    <div id="recentChatsArea">
                        <div class="section-title">ENCRYPTED_CONNECTIONS (محفوظة):</div>
                        <div class="users-list" id="recentChatsContainer">
                            <!-- المحادثات المحفوظة تظهر هنا -->
                        </div>
                    </div>
                </div>

                <!-- منطقة الشات -->
                <div class="chat-area">
                    <div class="chat-header">
                        <div style="display:flex; align-items:center;">
                            <button class="back-btn" onclick="closeMobileChat()">&#9664; BACK</button>
                            <span id="activeChatHeader">AWAITING_TARGET_SELECTION...</span>
                        </div>
                        <button class="small-btn" onclick="clearTerminal()" id="clearBtn" style="display:none;">CLEAR</button>
                    </div>
                    
                    <div class="messages-box" id="messagesBox">
                        <div style="text-align:center; opacity:0.5; margin-top:50px;">SELECT A CONNECTION TO INITIATE PROTOCOL</div>
                    </div>
                    
                    <div class="chat-input-box" id="chatInputArea" style="display: none;">
                        <input type="text" id="messageInput" placeholder="> TYPE_COMMAND..." onkeypress="checkEnter(event)">
                        <button class="btn" onclick="sendMessage()">> SEND</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAcqJlqxeCxehWuBlRsrIpL77ClTOYvgXo",
            authDomain: "program-73193.firebaseapp.com",
            projectId: "program-73193",
            storageBucket: "program-73193.firebasestorage.app",
            messagingSenderId: "98054437932",
            appId: "1:98054437932:web:ae2cc80b4eefc14873a589",
            measurementId: "G-QVXBGN8HQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let activeChatUser = null;
        let unsubscribeMessages = null;
        let userUnsubscribe = null;

        function updateSysLog(msg) {
            document.getElementById('sysLog').innerText = `SYSTEM_LOG > ${msg} _`;
        }

        window.loginWithGoogle = async function() {
            updateSysLog("INITIATING HANDSHAKE...");
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } 
            catch (error) { updateSysLog("HANDSHAKE_FAILED"); }
        };

        window.logout = async function() {
            await signOut(auth);
            window.location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                updateSysLog("AUTHENTICATED. FETCHING_DATA...");
                
                // جلب بيانات المستخدم وعمل مستمع (Listener) للمحادثات المحفوظة
                userUnsubscribe = onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        showMainScreen();
                        renderRecentChats(); // ميزة الحفظ الدائم
                    } else {
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('profileScreen').classList.remove('hidden');
                    }
                });
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
            }
        });

        window.saveProfile = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const uniqueId = document.getElementById('uniqueId').value.trim();
            const errorDiv = document.getElementById('profileError');

            if (!fullName || !username || !uniqueId) { errorDiv.innerText = "MISSING_PARAMETERS"; return; }
            if (uniqueId.length !== 4 || isNaN(uniqueId)) { errorDiv.innerText = "ID_MUST_BE_4_NUMBERS"; return; }

            const q = query(collection(db, "users"), where("uniqueId", "==", uniqueId));
            const snap = await getDocs(q);
            if (!snap.empty) { errorDiv.innerText = "ID_ALREADY_IN_USE. ABORT."; return; }

            userData = { uid: currentUser.uid, fullName, username, uniqueId, recentChats: [] };
            await setDoc(doc(db, "users", currentUser.uid), userData);
            showMainScreen();
        };

        function showMainScreen() {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = userData.fullName;
            document.getElementById('myIdDisplay').innerText = `#${userData.uniqueId}`;
            updateSysLog("SECURE_CHANNEL_OPEN");
        }

        // --- ميزة المحادثات المحفوظة ---
        function renderRecentChats() {
            const container = document.getElementById('recentChatsContainer');
            if (!userData.recentChats || userData.recentChats.length === 0) {
                container.innerHTML = `<div style="padding:15px; font-size:12px; color:var(--matrix-dark)">NO_DATA_FOUND.</div>`;
                return;
            }
            container.innerHTML = '';
            // عرض المحادثات بالعكس (الأحدث فوق)
            [...userData.recentChats].reverse().forEach(user => {
                container.innerHTML += `
                    <div class="user-item" onclick='selectUser(${JSON.stringify(user)})'>
                        <h4>> ${user.fullName}</h4>
                        <span>ID: #${user.uniqueId} | @${user.username}</span>
                    </div>
                `;
            });
        }

        window.searchUser = async function() {
            const queryText = document.getElementById('searchIdInput').value.trim();
            const searchArea = document.getElementById('searchResultsArea');
            const recentArea = document.getElementById('recentChatsArea');
            const container = document.getElementById('searchContainer');

            if (queryText.length === 0) {
                searchArea.style.display = 'none';
                recentArea.style.display = 'block';
                return;
            }

            searchArea.style.display = 'block';
            recentArea.style.display = 'none';
            container.innerHTML = '';

            const q = query(collection(db, "users"), where("uniqueId", "==", queryText));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                container.innerHTML = `<div style="padding:15px; font-size:12px; color:var(--danger)">TARGET_NOT_FOUND</div>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const user = docSnap.data();
                if (user.uid === currentUser.uid) {
                    container.innerHTML = `<div style="padding:15px; font-size:12px; color:var(--danger)">CANNOT_CONNECT_TO_SELF</div>`;
                } else {
                    container.innerHTML += `
                        <div class="user-item" onclick='selectUser(${JSON.stringify(user)})'>
                            <h4>> ${user.fullName}</h4>
                            <span>ID: #${user.uniqueId}</span>
                        </div>
                    `;
                }
            });
        };

        window.selectUser = function(user) {
            activeChatUser = user;
            document.getElementById('activeChatHeader').innerHTML = `TARGET: <span style="color:#fff">${user.fullName}</span> [#${user.uniqueId}]`;
            document.getElementById('chatInputArea').style.display = 'flex';
            document.getElementById('clearBtn').style.display = 'block';
            
            // تفعيل الموبايل (إخفاء القائمة وإظهار الشات)
            if(window.innerWidth <= 768) {
                document.getElementById('sidebarArea').classList.add('hide-mobile');
            }

            loadMessages();
        };

        // زر الرجوع في الموبايل
        window.closeMobileChat = function() {
            document.getElementById('sidebarArea').classList.remove('hide-mobile');
        };

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            input.value = ''; 

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: text,
                senderId: currentUser.uid,
                timestamp: Date.now()
            });

            // تحديث قائمة المحادثات (حفظ الشخص عندك وعند الطرف الثاني)
            const chatObjForMe = { uid: activeChatUser.uid, fullName: activeChatUser.fullName, uniqueId: activeChatUser.uniqueId, username: activeChatUser.username };
            const chatObjForThem = { uid: currentUser.uid, fullName: userData.fullName, uniqueId: userData.uniqueId, username: userData.username };
            
            // إزالة الشخص لو كان موجود أصلاً وإضافته من جديد ليكون بالأعلى (محاكاة)
            // بس للتبسيط نستخدم arrayUnion
            await updateDoc(doc(db, "users", currentUser.uid), {
                recentChats: arrayUnion(chatObjForMe)
            });
            await updateDoc(doc(db, "users", activeChatUser.uid), {
                recentChats: arrayUnion(chatObjForThem)
            });
        };

        window.checkEnter = function(e) { if (e.key === 'Enter') sendMessage(); };

        // زر مسح التيرمنال (ينظف الشاشة فقط)
        window.clearTerminal = function() {
            document.getElementById('messagesBox').innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:50px;">TERMINAL_CLEARED...</div>`;
        };

        function formatTime(ms) {
            const d = new Date(ms);
            let h = d.getHours();
            let m = d.getMinutes();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12; 
            m = m < 10 ? '0'+m : m;
            return `${h}:${m} ${ampm}`;
        }

        function loadMessages() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            const messagesBox = document.getElementById('messagesBox');

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesBox.innerHTML = '';
                if (snapshot.empty) {
                    messagesBox.innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:50px;">NO_PREVIOUS_LOGS...</div>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    messagesBox.innerHTML += `
                        <div class="message ${isMe ? 'sent' : 'received'}">
                            ${msg.text}
                            <span class="msg-time">${formatTime(msg.timestamp)}</span>
                        </div>
                    `;
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
