<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE MOBILE CYBER TERMINAL v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --matrix-green: #00ff41;
            --matrix-dark: #004d0f;
            --danger: #ff003c;
            --border-glow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        /* تأثير خطوط الشاشة الكلاسيكية CRT */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 9999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--matrix-green);
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            background: #000;
        }

        .sys-bar {
            position: absolute;
            top: 2px;
            right: 8px;
            font-size: 8px;
            color: var(--matrix-dark);
            z-index: 10000;
            display: flex;
            gap: 6px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .screen.hidden {
            display: none !important;
        }

        .box {
            width: 100%;
            max-width: 340px;
            border: 1px solid var(--matrix-green);
            padding: 25px 20px;
            box-shadow: inset 0 0 12px rgba(0, 255, 65, 0.2);
            background: #010401;
            text-align: center;
        }

        h2 { font-size: 17px; margin-bottom: 18px; letter-spacing: 1px; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #000;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-green);
            box-shadow: var(--border-glow);
        }

        .btn {
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 12px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:active { background: var(--matrix-green); color: #000; }

        .mobile-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease-in-out;
        }

        #chatPane {
            transform: translateX(100%);
            z-index: 20;
        }

        .app-container.in-chat #chatPane { transform: translateX(0); }
        .app-container.in-chat #homePane { transform: translateX(-100%); }

        .pane-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--matrix-dark);
            background: #020602;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 50px;
            flex-shrink: 0;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .user-row {
            padding: 14px 15px;
            border-bottom: 1px solid #001200;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-row:active { background: #001f00; }

        /* منطقة الرسائل والإصلاح التام لإظهار زر الإرسال والـ Input */
        .messages-area {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .msg.sent {
            align-self: flex-start;
            border-right: 2px solid var(--matrix-green);
            background: #001200;
        }

        .msg.received {
            align-self: flex-end;
            border-left: 2px solid var(--matrix-dark);
            background: #040404;
            color: #ccc;
        }

        .msg-time {
            font-size: 8px;
            display: block;
            margin-top: 3px;
            opacity: 0.5;
            text-align: left;
        }

        .quick-payloads {
            display: flex;
            gap: 5px;
            padding: 6px 10px;
            background: #010301;
            border-top: 1px dashed var(--matrix-dark);
            overflow-x: auto;
            flex-shrink: 0;
        }

        .payload-chip {
            background: transparent;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-green);
            font-size: 10px;
            padding: 4px 8px;
            white-space: nowrap;
            cursor: pointer;
        }

        /* شريط الإدخال الثابت أسفل الشاشة تماماً بدون اختفاء */
        .input-bar {
            padding: 10px;
            border-top: 1px solid var(--matrix-dark);
            background: #000000;
            display: flex;
            gap: 8px;
            width: 100%;
            flex-shrink: 0;
            align-items: center;
            z-index: 50;
        }

        .input-bar input {
            margin-bottom: 0;
            flex: 1;
            padding: 10px;
            font-size: 13px;
            background: #050505;
        }

        .input-bar .btn {
            width: 75px;
            padding: 10px;
            font-size: 12px;
            height: 41px;
        }

        .mini-btn {
            background: transparent;
            border: 1px solid var(--matrix-dark);
            color: var(--matrix-dark);
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }
        .mini-btn:hover { border-color: var(--matrix-green); color: var(--matrix-green); }

        .error-msg { color: var(--danger); font-size: 11px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="sys-bar">
        <span id="secureStatus">SECURE: ON</span> | 
        <span id="clockStat">00:00</span>
    </div>

    <div class="app-container" id="appContainer">
        
        <!-- 1. شاشة الدخول -->
        <div id="loginScreen" class="screen">
            <div class="box">
                <h2>[ MOBILE GATEWAY v5.0 ]</h2>
                <button class="btn" onclick="loginWithGoogle()">> GOOGLE AUTH</button>
            </div>
        </div>

        <!-- 2. شاشة إعداد البروفايل -->
        <div id="profileScreen" class="screen hidden">
            <div class="box">
                <h2>[ CONFIG PROFILE ]</h2>
                <div id="profileError" class="error-msg"></div>
                <input type="text" id="fullName" placeholder="> FULL NAME">
                <input type="text" id="username" placeholder="> ALIAS">
                <input type="text" id="uniqueId" placeholder="> 4-DIGIT PIN" maxlength="4">
                <button class="btn" onclick="saveProfile()">> DEPLOY SECURE ID</button>
            </div>
        </div>

        <!-- 3. الشاشة الرئيسية للموبايل -->
        <div id="mainScreen" class="screen hidden" style="padding: 0;">
            <div class="mobile-view">
                
                <!-- القائمة والبحث -->
                <div class="pane" id="homePane">
                    <div class="pane-header">
                        <div>
                            <span id="myNameDisplay" style="color:#fff; font-size:13px;" onclick="copyMyId()">...</span>
                            <span id="myIdDisplay" style="color:var(--matrix-dark); font-size:11px;"></span>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="mini-btn" onclick="toggleMatrixMode()">GLOW</button>
                            <button class="mini-btn" onclick="logout()" style="border-color:var(--danger); color:var(--danger);">EXIT</button>
                        </div>
                    </div>
                    <div style="padding: 8px 10px; background: #000; border-bottom: 1px solid var(--matrix-dark); flex-shrink: 0;">
                        <input type="text" id="searchIdInput" placeholder="> SEARCH 4-DIGIT ID..." oninput="searchUser()" style="margin-bottom:0;">
                    </div>
                    <div class="list-container" id="mainListContainer">
                        <div style="padding:15px; font-size:10px; color:var(--matrix-dark); text-align:center;">NO_CHANNELS_OPEN</div>
                    </div>
                </div>

                <!-- شاشة الدردشة الثابتة والكاملة للموبايل -->
                <div class="pane" id="chatPane">
                    <div class="pane-header">
                        <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
                            <button class="mini-btn" onclick="closeChat()">◀ BACK</button>
                            <span id="activeChatTitle" style="font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">TARGET</span>
                        </div>
                        <button class="mini-btn" onclick="clearScreenLogs()">WIPE</button>
                    </div>
                    
                    <div class="messages-area" id="messagesBox">
                        <div style="text-align:center; opacity:0.3; margin-top:30px; font-size:10px;">SECURE TUNNEL ACTIVE</div>
                    </div>

                    <!-- شريط الأوامر السريعة -->
                    <div class="quick-payloads">
                        <button class="payload-chip" onclick="sendPayload('السلام عليكم، النظام مستقر.')">> سلام</button>
                        <button class="payload-chip" onclick="sendPayload('تم فحص التشفير بنجاح.')">> فحص</button>
                        <button class="payload-chip" onclick="sendPayload('أرسل لي البيانات المطلوبة.')">> بيانات</button>
                        <button class="payload-chip" onclick="sendPayload('انتهت الجلسة.')">> خروج</button>
                    </div>
                    
                    <!-- شريط الإدخال الثابت والمصلح تماماً -->
                    <div class="input-bar">
                        <input type="text" id="messageInput" placeholder="> TYPE MESSAGE..." onkeypress="onEnterPress(event)">
                        <button class="btn" onclick="sendTextMessage()">SEND</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcqJlqxeCxehWuBlRsrIpL77ClTOYvgXo",
            authDomain: "program-73193.firebaseapp.com",
            projectId: "program-73193",
            storageBucket: "program-73193.firebasestorage.app",
            messagingSenderId: "98054437932",
            appId: "1:98054437932:web:ae2cc80b4eefc14873a589",
            measurementId: "G-QVXBGN8HQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let activeChatUser = null;
        let messagesUnsubscribe = null;

        // تحديث الساعة ونظام الأمان الحي
        setInterval(() => {
            const d = new Date();
            document.getElementById('clockStat').innerText = `${d.getHours()}:${d.getMinutes()<10?'0':''}${d.getMinutes()}`;
        }, 1000);

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } catch(e) {}
        };

        window.logout = async function() {
            await signOut(auth);
            window.location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        showDashboard();
                        renderChatList();
                    } else {
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('profileScreen').classList.remove('hidden');
                    }
                });
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
            }
        });

        window.saveProfile = async function() {
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const uniqueId = document.getElementById('uniqueId').value.trim();
            const errDiv = document.getElementById('profileError');

            if (!fullName || !username || !uniqueId) { errDiv.innerText = "ERROR: FIELDS REQUIRED"; return; }
            if (uniqueId.length !== 4 || isNaN(uniqueId)) { errDiv.innerText = "ERROR: PIN MUST BE 4 DIGITS"; return; }

            const q = query(collection(db, "users"), where("uniqueId", "==", uniqueId));
            const snap = await getDocs(q);
            if (!snap.empty) { errDiv.innerText = "ERROR: PIN ALREADY TAKEN"; return; }

            userData = { uid: currentUser.uid, fullName, username, uniqueId, recentChats: [] };
            await setDoc(doc(db, "users", currentUser.uid), userData);
            showDashboard();
        };

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = `> ${userData.fullName}`;
            document.getElementById('myIdDisplay').innerText = `PIN: #${userData.uniqueId}`;
        }

        window.copyMyId = function() {
            navigator.clipboard.writeText(userData.uniqueId);
            alert("COPIED PIN: #" + userData.uniqueId);
        };

        let intenseGlow = false;
        window.toggleMatrixMode = function() {
            intenseGlow = !intenseGlow;
            document.documentElement.style.setProperty('--border-glow', intenseGlow ? '0 0 15px rgba(0, 255, 65, 0.9)' : '0 0 10px rgba(0, 255, 65, 0.4)');
            alert(intenseGlow ? "MODE: HIGH INTENSITY GLOW" : "MODE: STANDARD MATRIX");
        };

        function renderChatList() {
            const container = document.getElementById('mainListContainer');
            const chats = userData.recentChats || [];

            if (chats.length === 0) {
                container.innerHTML = `<div style="padding:15px; font-size:10px; color:var(--matrix-dark); text-align:center;">NO_SAVED_CHANNELS</div>`;
                return;
            }

            container.innerHTML = '';
            [...chats].reverse().forEach(u => {
                container.innerHTML += `
                    <div class="user-row" onclick='openChatWindow(${JSON.stringify(u)})'>
                        <div>
                            <h4 style="font-size:12px; color:#fff;">> ${u.fullName}</h4>
                            <span style="font-size:9px; color:var(--matrix-dark);">PIN: #${u.uniqueId}</span>
                        </div>
                        <span style="font-size:9px; color:var(--matrix-green);">CONNECT ▶</span>
                    </div>
                `;
            });
        }

        window.searchUser = async function() {
            const queryText = document.getElementById('searchIdInput').value.trim();
            if (queryText.length === 0) {
                renderChatList();
                return;
            }

            const q = query(collection(db, "users"), where("uniqueId", "==", queryText));
            const snap = await getDocs(q);
            const container = document.getElementById('mainListContainer');

            if (snap.empty) {
                container.innerHTML = `<div style="padding:15px; font-size:10px; color:var(--danger); text-align:center;">TARGET_NOT_FOUND</div>`;
                return;
            }

            container.innerHTML = '';
            snap.forEach(docSnap => {
                const u = docSnap.data();
                if (u.uid !== currentUser.uid) {
                    container.innerHTML += `
                        <div class="user-row" onclick='openChatWindow(${JSON.stringify(u)})'>
                            <div>
                                <h4 style="font-size:12px; color:#fff;">> ${u.fullName}</h4>
                                <span style="font-size:9px; color:var(--matrix-dark);">PIN: #${u.uniqueId}</span>
                            </div>
                            <span style="font-size:9px; color:var(--matrix-green);">INITIATE ▶</span>
                        </div>
                    `;
                }
            });
        };

        window.openChatWindow = function(targetUser) {
            activeChatUser = targetUser;
            document.getElementById('activeChatTitle').innerText = `${targetUser.fullName} (#${targetUser.uniqueId})`;
            document.getElementById('appContainer').classList.add('in-chat');
            loadActiveMessages();
        };

        window.closeChat = function() {
            document.getElementById('appContainer').classList.remove('in-chat');
            activeChatUser = null;
            if (messagesUnsubscribe) messagesUnsubscribe();
            renderChatList();
        };

        window.sendPayload = function(txt) {
            document.getElementById('messageInput').value = txt;
            sendTextMessage();
        };

        window.sendTextMessage = async function() {
            const inputField = document.getElementById('messageInput');
            const txt = inputField.value.trim();
            if (!txt || !activeChatUser) return;

            inputField.value = '';

            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: txt,
                senderId: currentUser.uid,
                timestamp: Date.now()
            });

            const myObj = { uid: currentUser.uid, fullName: userData.fullName, uniqueId: userData.uniqueId, username: userData.username };
            const targetObj = { uid: activeChatUser.uid, fullName: activeChatUser.fullName, uniqueId: activeChatUser.uniqueId, username: activeChatUser.username };

            await updateDoc(doc(db, "users", currentUser.uid), { recentChats: arrayUnion(targetObj) });
            await updateDoc(doc(db, "users", activeChatUser.uid), { recentChats: arrayUnion(myObj) });
        };

        window.onEnterPress = function(e) { if (e.key === 'Enter') sendTextMessage(); };
        window.clearScreenLogs = function() { document.getElementById('messagesBox').innerHTML = `<div style="text-align:center; opacity:0.3; margin-top:30px; font-size:10px;">BUFFER_CLEARED</div>`; };

        function formatHour(ms) {
            const d = new Date(ms);
            return `${d.getHours()}:${d.getMinutes() < 10 ? '0'+d.getMinutes() : d.getMinutes()}`;
        }

        function loadActiveMessages() {
            if (!activeChatUser) return;
            const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
            const box = document.getElementById('messagesBox');

            if (messagesUnsubscribe) messagesUnsubscribe();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                box.innerHTML = '';
                if (snapshot.empty) {
                    box.innerHTML = `<div style="text-align:center; opacity:0.3; margin-top:30px; font-size:10px;">NO_PACKETS_YET</div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    const mine = m.senderId === currentUser.uid;
                    box.innerHTML += `
                        <div class="msg ${mine ? 'sent' : 'received'}">
                            ${m.text}
                            <span class="msg-time">${formatHour(m.timestamp)}</span>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
